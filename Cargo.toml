[package]
name = "mtvanitykey"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/h3lix1/MTVanityKey"
description = "Meshtastic node-ID vanity key generator (CPU, Apple Metal, NVIDIA CUDA) with an HTTP job-queue API"
readme = "README.md"
keywords = ["meshtastic", "vanity", "x25519", "gpu", "crc32"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["/target"]

[lib]
name = "mtvanitykey"
path = "src/lib.rs"

[[bin]]
name = "mtvanitykey"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
curve25519-dalek = { version = "5", features = ["precomputed-tables"] }
hex = "0.4"
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The command line, the threaded engine, the API server and the GPU
# backends (the `cli` feature).
clap = { version = "4", features = ["derive", "env"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
ctrlc = { version = "3", optional = true }
num_cpus = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
tiny_http = { version = "0.12", optional = true }
libloading = { version = "0.9", optional = true }

[features]
default = ["cli"]
# Everything that needs threads, the OS CSPRNG, sockets or a GPU. Without it
# (`--no-default-features`) the library is the portable core: pattern and
# prefix parsing, hit verification and the single-threaded `stepper`, which
# builds for wasm32-unknown-unknown.
cli = ["dep:clap", "dep:crossbeam-channel", "dep:ctrlc", "dep:num_cpus", "dep:rand", "dep:tiny_http"]
cuda = ["cli", "dep:libloading"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[build-dependencies]
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
rayon = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
