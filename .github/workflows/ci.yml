name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (CPU)
        run: cargo build --release --locked
      - name: Test (CPU; GPU tests skip without a device)
        run: cargo test --release --locked

  macos:
    name: build (macOS, Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Hosted runners have no usable GPU, so this compiles everything
      # (including the Metal host code) without running the GPU tests.
      - name: Build
        run: cargo build --release --locked
      - name: Build tests
        run: cargo test --release --locked --no-run

  wasm:
    name: build (wasm32, portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The library without the `cli` feature (no threads, sockets, OS RNG
      # or GPU), as a browser build uses it.
      - name: Build the library for wasm32
        run: cargo build --lib --release --locked --no-default-features --target wasm32-unknown-unknown
      - name: Test the portable core (native, no default features)
        run: cargo test --release --locked --no-default-features

  runpod:
    name: RunPod handler self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Result encryption and job-input validation; no GPU needed.
      - name: Self-test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r deploy/runpod/requirements.txt
          cd deploy/runpod && /tmp/venv/bin/python selftest.py

  cuda:
    name: build (CUDA)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      CUDA_ARCH: sm_120
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: apt-get update -qq && apt-get install -y -qq curl build-essential >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      # nvcc compiles the kernels at build time; no GPU is needed for that.
      - name: Build with CUDA
        run: cargo build --release --locked --features cuda
      - name: Build tests with CUDA
        run: cargo test --release --locked --features cuda --no-run
